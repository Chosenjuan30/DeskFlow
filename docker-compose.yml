

# ─────────────────────────────────────────────────────────────
#  DeskFlow — Local Development Infrastructure
#  Usage (infrastructure only, run app from IntelliJ):
#    docker-compose up -d
#
#  Usage (full stack including built images):
#    docker-compose --profile full-stack up -d
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: deskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deskflow
      POSTGRES_USER: deskflow
      POSTGRES_PASSWORD: deskflow_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskflow -d deskflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deskflow-net

  # ── Redis ────────────────────────────────────────────────────
  # Port mapped to 6380 on host to avoid conflict with other local Redis instances.
  # Update REDIS_PORT in application-dev.yml / .env if you change this.
  redis:
    image: redis:7-alpine
    container_name: deskflow-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deskflow-net

  # ── Zookeeper ────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: deskflow-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - deskflow-net

  # ── Kafka ────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: deskflow-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"      # external (host / IntelliJ)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT = accessible from host; PLAINTEXT_INTERNAL = inside docker network
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - deskflow-net

  # ── Kafka UI ─────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: deskflow-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - deskflow-net

  # ── MailHog (local SMTP + web UI) ────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: deskflow-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"    # SMTP
      - "8025:8025"    # Web UI  →  http://localhost:8025
    networks:
      - deskflow-net

  # ── Backend (full-stack profile only) ────────────────────────
  backend:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deskflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/deskflow
      DATABASE_USERNAME: deskflow
      DATABASE_PASSWORD: deskflow_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    networks:
      - deskflow-net

  # ── Frontend (full-stack profile only) ───────────────────────
  frontend:
    profiles: ["full-stack"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deskflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - deskflow-net

# ─────────────────────────────────────────────────────────────
networks:
  deskflow-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
